<script>
const GC=['#c98b5a','#5bc0eb','#ff6fa8','#f08c00','#e03131','#b5179e','#7b2cbf','#1c3faa','#8a8a8a'],GP=[60,100,140,180,220,260,300,380,150];
const t=(g,n,e,d,v)=>[n,'p',GP[g],GC[g],e,g,d,v];
const POSES=["Миссионерская: партнёр на спине, вы сверху лицом к лицу. Удобно целоваться и смотреть в глаза.","Наездница: партнёр лежит на спине, вы сверху сами задаёте темп и глубину.","Обратная наездница: вы сверху спиной к партнёру, он держит вас за бёдра.","Ложечка: лёжа на боку, один прижимается к спине другого. Нежно и неспешно.","Сзади: партнёр на четвереньках или у края кровати, вы позади. Ритм задаёте вместе.","Лицом к лицу сидя: вы сидите у партнёра на коленях, обнявшись и целуясь.","На краю кровати: партнёр лежит на краю кровати, вы стоите или на коленях перед ним.","Стоя: лицом к лицу или у стены, опираясь друг на друга.","Бабочка: партнёр на краю кровати с приподнятыми бёдрами, вы стоите перед ним.","Кресло: вы сидите в кресле, партнёр сверху лицом к вам.","Поза 69: одновременные оральные ласки, лёжа на боку или один над другим."];

const IC={go:'➜',jail:'🔒',gtj:'⏸️',free:'🅿️',ch:'❓',tax:'💸',rr:'🚂',ut:'💡'};function render(){const fc=fl,fk=flk,f0=first,dc=dcls;fl=-1;dcls='';first=false;const b=document.getElementById('board');let h='';
 C.forEach((c,i)=>{const[r,k]=rc(i);const toks=P.map((p,j)=>p.pos==i?`<i class="${mv==j?'m':''}" style="background:${p.c}"></i>`:'').join('');
  h+=`<div class="c${i%10==0?' k':''}${fc==i?' '+fk:''}${f0?' in':''}" style="grid-area:${r}/${k};--d:${i*22}ms" onclick="info(${i})">${c[3]?`<div class="s" style="background:${c[3]}"></div>`:''}${(IC[c[1]]||c[4])?`<em>${IC[c[1]]||c[4]}</em>`:''}<b>${c[0]}</b>${c[2]&&c[1]!='tax'?`<span>${c[2]}💋</span>`:''}${own[i]!==undefined?`<div class="o" style="background:${P[own[i]].c}"></div>`:''}${lv[i]?'<span class="lv">'+'🏠'.repeat(lv[i])+'</span>':''}<div class="t">${toks}</div></div>`});
 const pl=P.map((p,j)=>`<div class="${j==cur&&!over?'a':''}" style="color:${p.c}"><span style="color:var(--ink)">${p.n}</span><br><b style="color:var(--ink)">${p.m}💋</b><span style="color:var(--ink)">${p.jail?' ⏸':''}${p.stop?' 🛑'+p.stop:''}</span></div>`).join('');
 const d=['','⚀','⚁','⚂','⚃','⚄','⚅'];let bt='';
 if(over)bt='<button onclick="location.reload()">Новая игра</button>';
 else if(phase=='roll')bt=`<button onclick="act('roll')">🎲 Бросить кубики</button>`;
 else if(phase=='mv')bt='<button disabled style="opacity:.45">…</button>';else if(phase=='up')bt=`<button onclick="act('up')">🏠 Построить дом за ${C[P[cur].pos][2]/2|0}💋</button><button class="g" onclick="act('skip')">Пропустить</button>`;else if(phase=='buy')bt=`<button onclick="act('buy')">Купить за ${C[P[cur].pos][2]}💋</button><button class="g" onclick="act('skip')">Отказаться</button>`;

let AC,mg,mm,mon=1,son=1,mi;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.55;mg.connect(AC.destination);mm=AC.createGain();mm.gain.value=.8;mm.connect(mg)}if(AC.state=='suspended')AC.resume()}
function tn(f,d,ty,v,w,dest){if(!AC)return;const t=AC.currentTime+(w||0),o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v||.15,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||mg);o.start(t);o.stop(t+d+.05)}
const N=n=>440*2**((n-69)/12),arp=(a,d,ty,v,g)=>a.forEach((n,k)=>tn(N(n),d,ty,v,k*(g||.08)));

buy:()=>arp([72,76,79,84],.3,'triangle',.15),coin:()=>{tn(1320,.12,'square',.06);tn(1760,.22,'square',.06,.08)},loss:()=>{tn(300,.2,'sawtooth',.07);tn(220,.3,'sawtooth',.07,.12)},
toast:()=>{tn(880,.12,'sine',.1);tn(1175,.2,'sine',.1,.08)},chance:()=>arp([84,88,91,96],.4,'sine',.1,.06),win:()=>arp([72,76,79,84],.4,'triangle',.15,.1),fan:()=>arp([72,76,79,84,79,84,88,91],.5,'triangle',.14,.12)};
function snd(k){if(!son)return;ac();SF[k]&&SF[k]();if(['land','buy','loss'].includes(k)&&navigator.vibrate)navigator.vibrate(25)}
function music(){ac();if(mi)return;let st=0;const H=[[57,60,64],[53,57,60],[55,60,64],[55,59,62]],B=[45,41,36,43];
mi=setInterval(()=>{if(!mon||document.hidden)return;const q=(st>>3)%4,ch=H[q],k=st%8;if(k==0){tn(N(B[q]),1.8,'sine',.22,0,mm);ch.forEach(n=>tn(N(n),3.2,'triangle',.05,0,mm))}
tn(N(ch[[0,1,2,1,2,1,0,1][k]]+12),.8,'sine',.09,0,mm);if(k==4)tn(N(ch[2]+24),1,'sine',.04,0,mm);st++},430)}
function tg(w){if(w=='m'){mon=!mon;if(mon)music()}else son=!son;document.querySelectorAll('#snd button')[w=='m'?0:1].classList.toggle('off',!(w=='m'?mon:son))}
